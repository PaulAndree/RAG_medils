services:
  api:
    build: .
    command:
      - uvicorn
      - api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: documents_embeddings_live
      POSTGRES_HOST: postgres
    ports:
      - "127.0.0.1:8002:8000"
    restart: unless-stopped
    depends_on:
      - postgres
      - qdrant

  indexer:
    build: .
    command:
      - python
      - -m
      - sql_rag.indexer
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_ALIAS: documents_embeddings_live
      QDRANT_COLLECTION_PREFIX: documents_embeddings
      POSTGRES_HOST: postgres
    profiles:
      - jobs
    depends_on:
      - postgres
      - qdrant
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ragdb
      POSTGRES_USER: raguser
      POSTGRES_PASSWORD: ragpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6335:6333"
      - "6336:6334"
    volumes:
      - qdrant_data:/qdrant/storage
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3003:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  qdrant_data: