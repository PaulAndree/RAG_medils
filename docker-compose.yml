services:
  api:
    build: .
    command:
      - uvicorn
      - api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: documents_embeddings_live
      POSTGRES_HOST: postgres
    ports:
      - "127.0.0.1:8002:8000"
    restart: unless-stopped
    depends_on:
      - postgres
      - qdrant

  passage-indexer:
    build: .
    command:
      - python
      - -m
      - indexing.passages.indexer_qdrant
    environment:
      PUSHGATEWAY_URL: http://pushgateway:9091
      QDRANT_URL: http://qdrant:6333
      POSTGRES_HOST: postgres
    profiles:
      - jobs
    depends_on:
      - postgres
      - pushgateway
      - qdrant

  argument-indexer:
    build: .
    command:
      - python
      - -m
      - indexing.arguments.indexer_qdrant
    environment:
      PUSHGATEWAY_URL: http://pushgateway:9091
      QDRANT_URL: http://qdrant:6333
      POSTGRES_HOST: postgres
    profiles:
      - jobs
    depends_on:
      - postgres
      - pushgateway
      - qdrant

  summary-indexer:
    build: .
    command:
      - python
      - -m
      - indexing.summaries.indexer_qdrant
    environment:
      PUSHGATEWAY_URL: http://pushgateway:9091
      QDRANT_URL: http://qdrant:6333
      POSTGRES_HOST: postgres
    profiles:
      - jobs
    depends_on:
      - postgres
      - pushgateway
      - qdrant

  graph-indexer:
    build: .
    command:
      - python
      - -m
      - indexing.graph.indexer_neo4j
    environment:
      POSTGRES_HOST: postgres
      PUSHGATEWAY_URL: http://pushgateway:9091
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-ragpassword}
      NEO4J_DATABASE: neo4j
    profiles:
      - jobs
    depends_on:
      - postgres
      - neo4j
      - pushgateway

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ragdb
      POSTGRES_USER: raguser
      POSTGRES_PASSWORD: ragpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6335:6333"
      - "6336:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  neo4j:
    image: neo4j:2026.09.0
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-ragpassword}
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - api
      - pushgateway

  pushgateway:
    image: prom/pushgateway:latest
    command:
      - --persistence.file=/pushgateway/metrics.db
      - --persistence.interval=30s
    ports:
      - "127.0.0.1:9091:9091"
    volumes:
      - pushgateway_data:/pushgateway
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3003:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  postgres_data:
  prometheus_data:
  pushgateway_data:
  grafana_data:
  qdrant_data:
  neo4j_data:
